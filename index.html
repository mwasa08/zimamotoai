<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── PWA Meta Tags ── -->
    <title>ZIMAMOTO AI — Smart Study Assistant</title>
    <meta name="description" content="AI-powered study assistant for African university students. Get smart summaries, exam questions, and academic advice." />
    <meta name="theme-color" content="#0072FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZIMAMOTO" />
    <meta name="application-name" content="ZIMAMOTO AI" />
    <meta name="msapplication-TileColor" content="#080C14" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- ── Open Graph ── -->
    <meta property="og:title" content="ZIMAMOTO AI" />
    <meta property="og:description" content="Smart AI Study Assistant for African University Students 🔥" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- ── PWA Manifest ── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Favicons & Apple Icons ── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- ── NEW: Google Identity Services (for Google Sign-In) ── -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ── Register Service Worker ── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ ZIMAMOTO SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
